name = "aotearoa-dashboard-auth"
main = "src/index.js"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "AUTH_KV", id = "09ab13e9b6fa4a2881f88b9580874ac3" }
]

[triggers]
# Twice daily. Cron schedules are plain UTC with no timezone awareness:
# 06:00 UTC = 6pm NZST, 18:00 UTC = 6am NZST (next day). During NZDT
# (UTC+13, roughly late Sep-early Apr) both firings land about an hour
# later than 6am/6pm local — fine for "roughly twice a day," and trivially
# adjustable later (shift both hours by +/-1 to bias toward NZDT instead).
crons = ["0 6 * * *", "0 18 * * *"]

[vars]
GOOGLE_CLIENT_ID = "294862769624-d8es2u7go6bi4ic1nv763e5qdrmv95jf.apps.googleusercontent.com"
FRONTEND_URL = "https://stevehona-prog.github.io/aotearoa-dashboard"
